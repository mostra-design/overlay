name: Build the served files

on:
  workflow_call:

permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OVERLAY_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check the tag names this version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(jq --raw-output .version package.json)
          if [ "$TAG" != "v$version" ]; then
            echo "The tag $TAG doesn't match package.json, which says $version. Tag v$version, or change the version first." >&2
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.13.0

      - name: Build
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Check the build
        run: node scripts/check-script.js dist/script dist/speech

      - name: Gather what gets signed and published
        run: |
          mkdir release
          cp dist/script/mostra*.js dist/script/overlay-*.js dist/script/release.json release/
          npm pack --ignore-scripts --pack-destination release

      - name: Hand over the files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 1
